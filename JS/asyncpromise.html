<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Promises</h1>
<h2>The .then() Method</h2>

<p id="demo"></p>

<script>
// Create a Promise
let myPromise = new Promise((resolve, reject) => {

// Code that might take some time goes here

  let success = false;
  if (success) {
    resolve("Promise Resolved");
  } else {
    reject("Promise Failed");
  }
});

// Using the Promise
myPromise
.then((value) => myDisplayer(value))
.catch((error) => myDisplayer(error));

// Funtion to display any text
function myDisplayer(text) {
  document.getElementById("demo").innerHTML = text;
}
</script>

</body>
</html>
