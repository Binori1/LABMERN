<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Web Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.2rem;
    }

    .container {
      display: flex;
      margin-top: 60px; /* space for header */
      width: 100%;
    }

    .sidebar {
      width: 200px;
      background: #f4f4f4;
      padding: 1rem;
      border-right: 1px solid #ddd;
    }

    .sidebar button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border: none;
      background: #ddd;
      cursor: pointer;
      font-size: 1rem;
    }

    .sidebar button:hover {
      background: #bbb;
    }

    .main-content {
      flex: 1;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header>
    My Test Web Page
  </header>

  <div class="container">
    <div class="sidebar">
      <button onclick="loadContent('windows')">Windows</button>
      <button onclick="loadContent('android')">Android</button>
    </div>

    <div class="main-content" id="content">
      <h2>Welcome</h2>
      <p>Select a section from the sidebar to load content here.</p>
    </div>
  </div>

  <script>
    function loadContent(section) {
      const content = document.getElementById('content');
      if (section === 'windows') {
        content.innerHTML = `
          <h2>Windows Section</h2>
          <p>Windows is a popular operating system developed by Microsoft. 
          It provides a graphical interface, multitasking, and support for a wide range of applications.</p>
        `;
      } else if (section === 'android') {
        content.innerHTML = `
          <h2>Android Section</h2>
          <p>Android is an open-source mobile operating system developed by Google. 
          It powers millions of smartphones and tablets worldwide, offering flexibility and customization.</p>
        `;
      }
    }
  </script>
</body>
</html>
