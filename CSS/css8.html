<!-- CSS Selectors  
id selector
Syn:-	
		#id-name{
			prop:val;
			.....
		}

mapping:
   <tag  id="id-name">		
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
	   #id1{ color:red; }
	   #id2{ color:blue; }
	</style>
  </head>
  <body>
	<h2>demo on id selector</h2>
	<h1 id="id1">Apple</h1>
	<h1 id="id2">Mango</h1>
	<h1 id="id1">Orange</h1> 
	<h1 id="id1 id2">Banana</h1>
  </body>
</html>
