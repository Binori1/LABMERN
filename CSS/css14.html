<!-- CSS Selectors  
group selector 
Syn:-	
		tag1,tag2,tag3,tag4,...{
			prop:val;
			.....
		}  
		#i1,#i2,#i3{	
			.......
		}
		.c1,.c2,.c3{
			.......
		}
		tag,#i,.c{
			....
		}
		:pc1,:pc2{
			.....
		}
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
 	  h1,h2,h3,h4,h5,h6{
		color:yellow;
		background:green;
		width:20%;
		text-align:center;
	  }
	  #i1,#i2{
		color:red;
	  }
	  .c1,.c2,.c3{
		color:blue;
	  }
	  [width],[height]{
		...
	  }
	</style>
  </head>
  <body>
	<h2>demo on group selector</h2>
	<h1>HTML</h1>	<h2>CSS</h2>	<h3>Javascript</h3>
	<h4>BootStrap</h4>	<h5>Angular</h5>	<h6>React</h6>
	<h2>Jquery</h2>	<h3>Ajax</h3>	<h2>Node</h2>
  </body>
</html>
