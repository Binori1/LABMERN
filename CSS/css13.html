<!-- CSS Selectors  
attribute selector 
Syn:-	
		tag[attribute]{
			prop:val;
			.....
		}  
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
	  /* [type] */
	  [type="text"]{
		color:red;
		padding:5px;
	  }
	  [type="password"]{
		color:blue;
	  }
	  img[height="150px"]{
		border-radius:50%;
	  }
	</style>
  </head>
  <body>
	<h2>demo on attribute selector</h2>
	<input type="text"> <br>
	<input type="text"> <br>
	<input type="password"> <br>
	<input type="email"> <br>
	<img src="images/baby.png">
	<img src="images/girl.jpg" height="200px">
	<img src="images/rose.jpeg" height="150px">
	<img src="images/tenor.gif" height="150px">	
	
  </body>
</html>
