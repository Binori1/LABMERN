<!-- CSS Selectors  
Selectors
=> selector is a style rule
=> select is group of properties
=> are used to customize/override existing stlyes of elements
=> we can define Selectors either in internal or external
Syn:
	selector {
	  property:value;
	  .......
	}
	
Types:
        *			#	  .	   space		>
	universal, tag, id, class, child, direct child,
	
	attribute, group, pseudo => elements, classes
	  []		 ,				  ::		 :

universal selector
=> common styles
Syn:-	
		*{
			prop:val;
			.....
		}
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
	  *{
	     border:2px solid red;
	   }
	</style>
  </head>
  <body>
	<h2>demo on universal selector</h2>
	<h1>HTML</h1>
	<h2>CSS</h2>
	<span>Javasript</span>
	<p>BootStrap</p>
	<ul>
		<li>Java</li>  <li>Python</li>  <li>Dot.net</li>
		<li>UI Tech</li>
	</ul>	 
  </body>
</html>
