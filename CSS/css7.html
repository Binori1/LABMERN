<!-- CSS Selectors  
tag selector
=> common styles for all elements
Syn:-	
		tag{
			prop:val;
			.....
		}
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
	   a{
	     color:red;
		 text-decoration:none;
	   }
	   img{
		width:150px;
		height:150px;
		border-radius:50%;
	   }
	</style>
  </head>
  <body>
	<h2>demo on tag selector</h2>
	<a href="https://www.google.com">google</a> &nbsp; 
	<a href="https://www.youtube.com">youtube</a> &nbsp; 
	<a href="https://www.facebook.com">facebook</a> 
	<br> <br>
	<img src="images/baby.png">
	<img src="images/girl.jpg"> 	 
  </body>
</html>
