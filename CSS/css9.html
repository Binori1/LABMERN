<!-- CSS Selectors  
class selector
Syn:-	
		.class-name{
			prop:val;
			.....
		}

mapping:
   <tag  class="class-name">
   <tag  class="class1  class2  class3...">   
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CSS</title>
	<meta charset="UTF-8">
 	<style>
	  .c1{ background:cyan; }
	  .c2{ background:pink; }
	  .c3{ 
		 color:red;
		 text-align:center;
	   }	  
	</style>
  </head>
  <body>
	<h2>demo on class selector</h2>
	<h2 class="c1">HTML</h2>
	<h2 class="c2">CSS</h2>
	<h2 class="c1">Javascript</h2>
	<h2 class="c2">Angular</h2>
	<h2 class="c1">React</h2>
	<h2 class="c2">Node</h2>
	
	<span class="c3">Java</span>
	<p class="c3">Python</p>
	<div class="c3">Dot.Net</div>
	<input type="text" class="c3"> 
  </body>
</html>
