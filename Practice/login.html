<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeviceHub - Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F5F4F0;
    color: #1A1A18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  .card {
    background: #FFFFFF;
    border-radius: 12px;
    border: 1px solid #E6E4DC;
    padding: 2.5rem;
    width: 100%;
    max-width: 380px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #E6F1FB;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-icon i { font-size: 20px; color: #185FA5; }
  .brand-name { font-weight: 500; font-size: 18px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
  .subtitle { font-size: 14px; color: #6B6A65; margin: 0 0 1.5rem; }
  label {
    font-size: 13px;
    color: #6B6A65;
    display: block;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid #E6E4DC;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    font-family: inherit;
  }
  input:focus {
    border-color: #185FA5;
    box-shadow: 0 0 0 2px rgba(24,95,165,0.15);
  }
  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1.5rem;
  }
  a { color: #185FA5; text-decoration: none; font-size: 13px; }
  a:hover { text-decoration: underline; }
  .btn-primary {
    width: 100%;
    background: #185FA5;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    padding: 10px;
    margin-bottom: 1rem;
    cursor: pointer;
  }
  .btn-primary:hover { background: #0C447C; }
  .footer-text {
    text-align: center;
    font-size: 13px;
    color: #6B6A65;
    margin: 0;
  }
  .error {
    display: none;
    background: #FCEBEB;
    color: #791F1F;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-devices"></i></div>
      <span class="brand-name">DeviceHub</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your fleet</p>

    <div class="error" id="errorMsg">Please enter both email and password.</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <div class="forgot-row">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="footer-text">Don't have an account? <a href="#">Contact admin</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value.trim();
      var errorMsg = document.getElementById('errorMsg');

      if (!email || !password) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';

      // On successful "sign in", redirect to the dashboard overview page.
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
